# riscv-formal config — core32 + busadapt8 (plane32bus) at tt-neural-dataflow-fabric 01e19f7, BUS LEVEL.
# Every retirement happens at a loop end, i.e. on a cycle that is a multiple of 4 after reset, so every
# CHECK cycle below is a multiple of 4 — a check cycle with no retirement would make riscv-formal's
# `assume(spec_valid)` unsatisfiable and the check would PASS VACUOUSLY. run_aaj.sh re-proves
# reachability for each passing insn check in cover mode.

[options]
isa rv32i
solver bitwuzla

[depth]
insn            48
reg        8    48
pc_fwd     8    48
pc_bwd     8    48
causal     8    48
unique     1  8 48
liveness   1  8 56

[filter-checks]
# sub-word loads and stores: outside the word-only bus by design (the 08-12 ruling); not RV32I-conformant
- insn_(lb|lbu|lh|lhu|sb|sh)_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/core32.v
@basedir@/cores/@core@/busadapt8.v
@basedir@/cores/@core@/plane32bus.v
