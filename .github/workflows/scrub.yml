name: Scrub

# PORTED FROM jyh/jas (scripts/check_commit_trailers.py + scrub.yml), scheduled
# by the Captain 2026-08-23 ("schedule the ci immediately"). The gate and its
# fail-closed doctrine are jas's, debugged in production there; only the RANGE
# differs, and the difference is a ruling, not a soft choice:
#
#   THIS repo's history carries session URLs ACCEPTED by the Captain's
#   2026-08-23 ruling ("the published URLs stay" — no rewrite). A full-history
#   scan would therefore be permanently red, which is the exact
#   red-sweep-gets-abandoned failure jas's own header documents. So this
#   workflow scans THE PUSH DELTA: the rule it enforces is "no NEW session
#   trailer or URL enters history", which is the whole enforceable content of
#   the ruling. DECLARED COVERAGE LIMIT: on a brand-new branch (before-sha is
#   zeros) it falls back to the last 100 commits — imperfect, stated here
#   rather than hidden.
on:
  push:
  workflow_dispatch:
  # ⛔ ADDED 2026-09-13 (row D arm 2, finding 4): this workflow runs `check_pr_descriptions.py --open`,
  #   which enumerates the OPEN PRs AT RUN TIME, and until today it had no pull_request trigger. The run
  #   fired by a branch's last push finishes before that branch's PR exists, so the PR is not in the
  #   population while the green prints on the PR's own page. salt measured that twice in production
  #   (PR #5 91 s early, PR #6 61 s early) and closed it on 2026-08-31 (salt 423c5e59). The census found
  #   the doctrine there and not here, where the operation is identical.
  # ⚠️ NOT OVERSOLD: a push to the BASE still fires no run for the PRs targeting it; the arm's
  #   re-read-every-open-PR design covers that, which is why `push` STAYS.
  #   The range blocks that read github.event.before are line-identical to salt's, which has run them
  #   under pull_request since 08-31. The green arm is this change's own PR: its pull_request run
  #   must carry itself in the population.
  pull_request:

permissions:
  contents: read

concurrency:
  group: scrub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-trailers:
    name: no NEW session trailer enters history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gate proves it can fail before it is allowed to pass.
      - run: python scripts/check_commit_trailers.py --self-test
      - name: scan the pushed delta
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # ⛔ CARRIED FROM THE SIBLING JOB AFTER A REAL FORCE-PUSH KILLED THIS ONE.
          # 2026-08-25: a Captain-ruled history rewrite landed, and the next push
          # carried a before-sha naming commits that no longer exist. This step
          # ran `<dead-sha>..HEAD`, git exited 128, and the job RED with
          # "could not read history" -- a spurious failure on clean content.
          #
          # THE SIBLING JOB SURVIVED THE SAME PUSH, because it had been given
          # this guard days earlier. Same push, same repo, two jobs, opposite
          # outcomes: THE FIX LANDED WHERE THE ALARM WENT OFF AND WAS NEVER
          # CARRIED ACROSS. That is the whole defect; the code below is small.
          #
          # A before-sha must be REACHABLE, not merely non-empty. Rewritten-away
          # history is neither the "new branch" case nor the ordinary case, and
          # the old two-branch test had nowhere to put it.
          DEF="${{ github.event.repository.default_branch }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
            echo "push delta: $RANGE"
          elif MB=$(git merge-base "origin/$DEF" HEAD 2>/dev/null) && [ -n "$MB" ] \
               && [ "$MB" != "$(git rev-parse HEAD)" ]; then
            RANGE="$MB..HEAD"
            echo "before-sha absent or unreachable: merge-base with origin/$DEF -> $RANGE"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            # ⛔ THE MERGE-BASE FALLBACK DEGENERATES ON THE DEFAULT BRANCH, and
            # driving it is the only way I found that out. Force-push to the
            # default branch itself: the before-sha is unreachable AND
            # merge-base(origin/DEF, HEAD) IS HEAD, so the range is EMPTY and
            # the gate's own fail-closed fires -- the SAME spurious red, moved
            # one branch over. Reasoning about this arm produced a clean bill;
            # running it produced the bug.
            RANGE="HEAD~1..HEAD"
            echo "DECLARED PARTIAL COVERAGE: the default branch was rewritten, so"
            echo "  'new' cannot be bounded -- the delta against $DEF is empty by"
            echo "  construction. Scanning the tip commit ONLY. This is a stated"
            echo "  limit, not a clean scan; the next ordinary push scans in full."
          else
            echo "FAIL: cannot determine a delta range (no reachable before-sha,"
            echo "      no usable merge-base, no parent commit). Refusing to guess."
            exit 1
          fi
          echo "scanning $RANGE"
          python scripts/check_commit_trailers.py --range "$RANGE"

  private-paths:
    name: no NEW path into the private record enters a public repo
    runs-on: ubuntu-latest
    # Council 2026-08-25 ruled the firewall line at PATHS and booked this gate
    # as construction. Booked is not built: measured over the 9 commits that
    # landed at or after that stamp, THREE carried a path into the private
    # record -- the first 1m41s after the ruling. A rule with no instrument is
    # obeyed for as long as it is remembered.
    #
    # RANGE: the pushed delta, same doctrine as the job above and for a sharper
    # reason. Measured before this shipped, this history already carries 14 of
    # these shapes, all predating the ruling and protected by the commencement
    # clause. A full scan would be permanently red.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # BOTH ARMS DRIVEN BEFORE TRUST: a planted path must fail it, a
      # role-worded message must pass it, and the fixtures are the real
      # post-ruling instances rather than invented shapes.
      - run: python scripts/check_private_paths.py --self-test
      # The subject gate (desk QA) rides THIS job, which is required: a commit
      # subject is history, so its miss is permanent, unlike a PR body, which is
      # editable. It proves it can fail before it is allowed to pass.
      - run: python scripts/check_pr_descriptions.py --self-test
      - name: scan the pushed delta
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # ⛔ THE FALLBACK IS A CONTROL PATH AND THE FIRST ONE WAS NEVER DRIVEN.
          # Its original form was HEAD~100..HEAD, which on any new branch reaches
          # ~100 commits of PRE-RULING history -- so every new branch redded
          # permanently, on findings the commencement clause protects. That is
          # precisely the red-sweep-gets-abandoned failure this workflow's own
          # header names, reintroduced in the one code path that had both arms
          # reasoned and neither driven. Found by the jas seat's meta-gate.
          #
          # MERGE-BASE is the correct fallback: it scans what THIS BRANCH ADDS
          # relative to the mainline, which is the same question the before-sha
          # answers on an existing branch. Both paths are now driven as controls
          # before shipping, clean AND dirty.
          DEF="${{ github.event.repository.default_branch }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
            echo "push delta: $RANGE"
          elif MB=$(git merge-base "origin/$DEF" HEAD 2>/dev/null) && [ -n "$MB" ] \
               && [ "$MB" != "$(git rev-parse HEAD)" ]; then
            RANGE="$MB..HEAD"
            echo "new branch: merge-base with origin/$DEF -> $RANGE"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            # ⛔ SAME DEGENERATE CASE AS THE SIBLING JOB, AND I ALMOST LEFT IT
            # HERE. I repaired the trailer job's version of this, looked at the
            # diff, and saw that the fix had landed on exactly one of the two
            # jobs -- the one whose failure I had been handed. That is the
            # defect this whole day keeps producing: A FIX LANDS WHERE THE ALARM
            # WENT OFF. Carried deliberately, and driven on both jobs.
            #
            # Force-push to the DEFAULT BRANCH: before-sha unreachable AND
            # merge-base(origin/DEF, HEAD) IS HEAD, so the range is empty and
            # the fail-closed below fires on clean content.
            RANGE="HEAD~1..HEAD"
            echo "DECLARED PARTIAL COVERAGE: the default branch was rewritten, so"
            echo "  'new' cannot be bounded. Scanning the tip commit ONLY -- a"
            echo "  stated limit, not a clean scan."
          else
            echo "FAIL: cannot determine a delta range (no reachable before-sha,"
            echo "      no usable merge-base, no parent commit). Refusing to guess."
            exit 1
          fi
          echo "scanning $RANGE"
          python scripts/check_private_paths.py --range "$RANGE"
          # ⛔ THE SAME RANGE, NOT ANOTHER COPY OF ITS LOGIC. Subjects (lane
          # names and family references) and, forward only, bodies (lane names).
          # The tip-only fallback above can name an OLD commit; there the
          # baseline excuses the subject and never the body -- a stated limit.
          python scripts/check_pr_descriptions.py --range "$RANGE"
          # The branch name: a merge subject will quote it, and the forge
          # writes that subject where no hook runs.
          python scripts/check_pr_descriptions.py --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
      - name: tree ratchet -- residue the delta gate already fired on must not survive the next green
        run: |
          # The delta arm charges the commit that ADDS a private path; it cannot charge
          # the tree for KEEPING one (08/29: five red pushes, then a green that changed
          # nothing about them). This arm reds on any finding NOT in the committed
          # baseline (scripts/private_paths_baseline.tsv). Council row m, 2026-08-29.
          python scripts/check_private_paths.py --tree
      - name: message ratchet -- a violating message must not launder into the next scan's base
        run: |
          # The delta arm charges the push that carries a violating MESSAGE; it cannot
          # charge history for keeping one, so a fired-and-unrepaired message falls
          # into the next scan's BASE and every later push is green over it. Ruled
          # 2026-08-30 (council row u): ACCEPT + record, NO history rewrite, then
          # close the laundering. This arm scans EVERY message reachable from HEAD
          # against scripts/private_paths_message_baseline.tsv (sha + shape only --
          # never the line, which would trip the tree ratchet). Anything NEW reds.
          python scripts/check_private_paths.py --messages

      - name: every commit subject against the accepted-debt baseline (desk QA)
        # Red in both directions: a subject carrying a refused word that the
        # owner has not accepted, and a baseline row history no longer carries.
        run: python scripts/check_pr_descriptions.py --history
      - name: History ratchet (what each commit INTRODUCED -- the arm --range cannot be)
        run: |
          # ⭐⭐⭐ PORTED FROM x86lean 2026-09-10 ON THE HELM'S RULING (FLEET.md 48491666).
          # DRIVEN, not argued: two commits pushed together, commit 1 ADDS a private
          # path and commit 2 REMOVES it -- `--range BASE..HEAD` rc 0 (the NET
          # DIFFERENCE has no such file), `--tree` rc 0 (the TREE has no such file),
          # `--history` FAIL naming the intermediate commit and the blob. The blob
          # reaches a public remote and every gate is green.
          # ⛔ THE FLAG WAS ABSENT HERE, NOT MERELY UNRUN: argparse rejected it, so this
          # repository's intermediate commits had NEVER been read. First cut: 78
          # findings across 33 commits -- 62 are the tree ratchet's already-accepted
          # residue and 16 were introduced-then-repaired and had never been seen.
          # ⚠️ `fetch-depth: 0` is load-bearing -- the arm REFUSES a shallow clone by
          # name rather than walking a truncated history and reporting success.
          python scripts/check_private_paths.py --history

  ledger-tools-selftest:
    name: the ledger-tools suite runs at all (desk row KB)
    runs-on: ubuntu-latest
    # ⛔⛔ THIS JOB EXISTS BECAUSE A RED SELFTEST NOBODY RUNS IS INDISTINGUISHABLE
    # FROM A GREEN ONE. `docs/ledger-tools/selftest.py` is a 190-check suite over
    # the transcript classifier, the dedup rule, the silence math, the lane
    # firewall and the provenance manifests -- and until 2026-09-11 this workflow
    # named `ledger-tools` ZERO times, so the suite had never run in CI. It had
    # been RED on master for weeks (`MANIFEST: bundle missing`) while every visible
    # check on every push was green.
    #
    # ⇒ THE GENERALISABLE HALF IS NOT THE FAILURE, IT IS THE ABSENCE: a suite that
    #   runs and reports one known red is strictly better than a suite that does
    #   not run, because only the first one can tell you when a SECOND thing breaks.
    #
    # ✅ `verify.sh` GATES THIS JOB AGAIN (desk row LO, released 2026-09-13). It was red from 08-07
    #   on its `blob` row and ran here as a registered known red. The pin named the CURRENT
    #   artifact and was never re-pinned through the 42 commits that edited it after the pin, and the only
    #   birth binding (REPLAY-MANIFEST's rev) had been orphaned by the 08-16 history purge. The
    #   release: a `born` row matches the as-born blob BY CONTENT in the program's history, and the
    #   `blob` pin was re-pinned with its old value recorded. Both checks were driven red-first:
    #   never-in-history, shallow clone, drifted program, and the old script on the new manifest.
    steps:
      - uses: actions/checkout@v4
        with:
          # the `born` row walks the program's history; a shallow clone is a FAILURE there,
          # by design, never a pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the ledger-tools suite
        run: python docs/ledger-tools/selftest.py
      - name: the provenance bundle binds what it names (as born, and as pinned now)
        run: bash docs/provenance/verify.sh

  pr-descriptions:
    name: no private-record path in PR titles/bodies (the forge-side prose)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    # Desk row I(a): a PR's TITLE and BODY are not git objects, so the four
    # git-object arms above cannot see them -- the most-read public prose
    # surface on the repo page had no gate, and one body in this fleet carried
    # a private-record path for five days while every push stayed green. And
    # the FOURTH DOOR (same audit, item (f)): a push to the BASE fires no run
    # for the PRs targeting it, so a PR sits green and MERGEABLE while its
    # verdicts describe a base that no longer exists. So this job runs from
    # the PUSH workflow, re-reads EVERY open PR each time anything lands, and
    # reports REF-vs-RUN -- which object each verdict is about -- instead of
    # trusting status. The event payload is deliberately never read: a guard
    # is scoped by its event set, and this workflow has two trigger kinds.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gate proves it can fail before it is allowed to pass.
      - run: python scripts/check_pr_descriptions.py --self-test
      - name: scan every open PR's title and body via the forge API
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_pr_descriptions.py --open

  pre-push-proof:
    name: the pre-push hook refuses what the jobs above can only report
    runs-on: ubuntu-latest
    # ⛔ EVERY GATE ABOVE IS ON THE WRONG SIDE OF THE WIRE, AND THAT IS NOT A
    # CRITICISM OF THEM -- it is the reason this job exists. They run AFTER the
    # objects reach the public remote. On 2026-09-03 a push in this fleet carried
    # two private-record paths to a public remote; the gate went red, correctly,
    # and the bytes were already served by sha and stay served by sha until the
    # forge collects them on its own schedule. A report is not a repair.
    #
    # `.githooks/pre-push` asks the same two questions one step earlier, where
    # the answer is still free. But a hook is LOCAL configuration: CI's own clone
    # never runs it and cannot. What CI *can* do is prove the hook still works --
    # that its red arms are red and its green arm is green -- so that a hook
    # broken by an edit fails HERE rather than the next time it matters.
    #
    # The prover drives a real `git push` into a scratch bare remote in a temp
    # dir, never the repository under test, and carries a MUTATION CONTROL: the
    # same refused push must succeed with --no-verify, or its refusals prove
    # nothing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ⛔ THE INTERPRETER ARM, MASKED. A prover that names `python` by hand
      # reports `ok` WITHOUT THE GATE EVER RUNNING wherever `python` is absent --
      # measured in this fleet on 08/26, on a prover that had rotted exactly that
      # way. The arm only discriminates where `python` is missing, so it is made
      # missing here.
      - name: mask `python`, leaving only python3
        run: |
          mkdir -p "$RUNNER_TEMP/mask"
          printf '#!/bin/sh\necho "python: not found" >&2\nexit 127\n' > "$RUNNER_TEMP/mask/python"
          chmod +x "$RUNNER_TEMP/mask/python"
      - name: the mask must actually mask, and python3 must survive it
        run: |
          if PATH="$RUNNER_TEMP/mask:$PATH" python -c "" 2>/dev/null; then
            echo "MASK FAILED: \`python\` still runs -- the arm below would be vacuous."; exit 1
          fi
          PATH="$RUNNER_TEMP/mask:$PATH" python3 -c "" || { echo "python3 must still work"; exit 1; }
          echo "mask OK: python refuses, python3 runs"
      - name: the proof must hold with `python` masked
        run: PATH="$RUNNER_TEMP/mask:$PATH" sh .githooks/prove_pre_push.sh
      # ...and in an ordinary environment, so the mask cannot become the only
      # configuration the proof is ever exercised in.
      - name: and in an ordinary environment
        run: sh .githooks/prove_pre_push.sh
      # census D #7, second half (desk LQ, 2026-09-13): the commit-msg hook is PROVEN,
      # not only mode-checked. It reads its patterns from the trailer gate, and the
      # prover drives the five shapes through a real `git commit`, each first shown
      # to be a gate finding. The v2 hook scored 9 failed arms here (it passed three
      # of the five shapes and had no fail-closed arm).
      - name: the commit-msg proof must hold with `python` masked
        run: PATH="$RUNNER_TEMP/mask:$PATH" sh .githooks/prove_commit_msg.sh
      - name: and the commit-msg proof in an ordinary environment
        run: sh .githooks/prove_commit_msg.sh
      - name: the hooks are committed 100755, or they are INERT on macOS/Linux
        # census D #7 (2026-09-13): commit-msg was not in this loop, though it is the same kind of file.
        #   jas mode-checks its commit-msg hook; salt and saltworks did not.
        # `core.filemode` is false on Windows, so a chmod there never reaches the
        # index: a hook authored on that platform is committed 100644, runs on
        # the box that wrote it, and does nothing at all for everyone else.
        run: |
          for f in .githooks/pre-push .githooks/prove_pre_push.sh .githooks/commit-msg .githooks/prove_commit_msg.sh; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "FAIL $f is ${mode:-<untracked>} -- fix: git update-index --chmod=+x $f"
              exit 1
            fi
            echo "OK   $f is $mode"
          done

  sof-protocol-rule:
    name: the host `sof` rule is binding, satisfiable, and permits work
    runs-on: ubuntu-latest
    # Ordered by evidence (saltworks lead) 2026-09-06 11:0x, clause (iv): move the `sof`
    # host-protocol rule from STAGED to SCHEDULED. The verifier had settled it as STAGED with
    # a precise finding -- A RED-CAPABLE CONSUMER EXISTS AND NOTHING SCHEDULES IT -- and the
    # order names the state being left behind: "an arm that can go red but is never asked is
    # indistinguishable from an arm that passes, and it reports the reassuring direction."
    #
    # ⛔ WHY THIS JOB LIVES IN *THIS* WORKFLOW AND NOT IN ONE OF ITS OWN, WHICH WOULD BE
    #   TIDIER AND WOULD BE THE WRONG ANSWER. The order's real question is not "is it
    #   scheduled", it is "if the rule were violated, WHO WOULD SEE IT?" In this fleet the
    #   answer is a measured habit, not a hope: every seat quotes `Scrub ✅` in its bank and
    #   its bus post at every landing -- this seat's own 09-06 bank does it three times, once
    #   per commit. That habit names THIS workflow. A new workflow called something else would
    #   fire, could go red, and would go red IN A CHANNEL NO HABIT READS -- rebuilding the
    #   defect one level up, which is exactly what the order warns against. A failing job here
    #   makes the whole run red, so `Scrub ✅` becomes unquotable and the existing, proven
    #   reading habit covers the new arm for free.
    #
    # ⛔ DELIBERATELY UNFILTERED -- no `paths:` guard, same doctrine as the jobs above. The
    #   arm is sensitive to the adapter state it is fed (`kind`, `phase`, `c_dmem_req`), and a
    #   path filter narrow enough to look efficient is exactly wide enough to miss the change
    #   that matters. An over-narrow guard fails SILENTLY and in the reassuring direction.
    steps:
      - uses: actions/checkout@v4
      - name: install iverilog -- fail-closed, because "could not look" must never print green
        run: |
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq iverilog; then ok=1; break; fi
            echo "iverilog install attempt $i failed; retrying"; sleep 5
          done
          if [ "$ok" != 1 ] || ! command -v iverilog >/dev/null 2>&1; then
            echo "⛔ TOOLCHAIN UNAVAILABLE -- iverilog did not install, so THE ARM DID NOT RUN."
            echo "   This is RED on purpose and it is NOT a verdict on the rule."
            echo "   Soft-passing here would rebuild the very defect this job removes: an arm"
            echo "   that reports the reassuring direction when it could not look at all."
            exit 1
          fi
          iverilog -V | head -1
      # ⛔ THE PROVER RUNS FIRST, and that ordering is the house doctrine three jobs above:
      #   "The gate proves it can fail before it is allowed to pass." A scheduled arm that has
      #   quietly lost its teeth is green, and green is also what success looks like.
      #   One mutant per gate, each caught by ITS OWN gate -- see the prover's header for the
      #   mutant it BUILT AND WITHDREW, and why a void control is worse than no control.
      - name: the arm must still be able to go RED (one mutant per gate)
        run: sh docs/ledger-tools/prove_sof_protocol_arm.sh
      - name: THE RULE — bad host caught · good host clean · good host still does work
        run: sh SaltWorks/Silicon/Sim/reghost/run_sof_protocol_rule.sh

      # ⭐⭐ THE TWO COMPLIANT-HOST SWEEPS, CONVERTED FROM MEASUREMENTS INTO ARMS (2026-09-07).
      #   They were one-shots for exactly one reason: the DUT was read from a SHUTTLE CHECKOUT,
      #   and CI has none. The fabricated RTL is now VENDORED at
      #   SaltWorks/Silicon/Fabricated/01e19f7, so the DUT travels with the clone and these can
      #   be scheduled. Ordered by evidence (saltworks lead), whose word made the vendoring
      #   legitimate: THE TAPE-OUT FROZE THE SUBJECT, so this fixture cannot rot.
      - name: the vendored DUT is the FABRICATED DUT (conformance vs the EXTERNAL ref)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ⛔ FAIL-CLOSED ON ABSTAIN, same doctrine as the iverilog step above. The tool exits 3
          #   when it cannot reach the authority, and keeps that distinct from PASS on purpose;
          #   the CI POLICY is what turns "I could not look" into RED. A checker that cannot see
          #   its subject must never contribute a green tick to a run someone quotes.
          set +e; bash docs/ledger-tools/check_fabricated_fixture.sh; rc=$?; set -e
          case "$rc" in
            0) echo "conformance CONFIRMED against github.com/jyh/tt-neural-dataflow-fabric" ;;
            3) echo "⛔ ABSTAIN IS RED HERE — the authority was not consulted, so nothing was verified."; exit 1 ;;
            *) echo "⛔ the vendored bytes are not the fabricated bytes (rc=$rc)"; exit 1 ;;
          esac
      - name: compliant host, CADENCE — 40 offsets clean, and the control proves it can say otherwise
        run: |
          bash docs/ledger-tools/sweep_compliant_host_cadence.sh
          SWEEP_NEGATIVE_CONTROL=1 bash docs/ledger-tools/sweep_compliant_host_cadence.sh
      - name: compliant host, SHAPE — clean, with the VOID control pinned as an invariant
        run: |
          set -e
          SWEEP_SHAPES=1 bash docs/ledger-tools/sweep_compliant_host_cadence.sh
          # ⛔⛔ THE SHAPE CONTROL IS *PARTIAL* BY A KNOWN MECHANISM AND EXITS 1: a host asserting
          #   `sof` constantly REALIGNS THE MACHINE INTO FETCH, so the `eager` mutant defeats
          #   itself and that row is a VOID control, not a passing one. Excluding the control
          #   would hide that; asserting the EXACT pattern instead turns the limitation into a
          #   pinned invariant. If `eager` ever becomes controlled, or `base`/`burst` stop being
          #   caught, THAT IS NEWS and this step goes red.
          set +e
          SWEEP_SHAPES=1 SWEEP_NEGATIVE_CONTROL=1 bash docs/ledger-tools/sweep_compliant_host_cadence.sh > ctl.txt 2>&1
          set -e
          cat ctl.txt
          fail=0
          # ⛔ THE CAUGHT SET IS A SET, NOT A COUNT. Asserting "4 of 5" would stay green if a
          #   different member went void while another became controlled -- the total is the
          #   one thing that CANNOT distinguish those. Each member is named.
          for s in base burst coprime impatient; do
            grep -qE "^$s +[1-9][0-9]* " ctl.txt || { echo "⛔ $s is no longer CAUGHT by the cut"; fail=1; }
          done
          grep -qE '^eager +0 ' ctl.txt || { echo "⛔ eager is no longer a VOID control — the known self-defeat has CHANGED"; fail=1; }
          grep -q 'NEGATIVE_CONTROL=PARTIAL' ctl.txt || { echo "⛔ the control verdict is no longer PARTIAL"; fail=1; }
          grep -q 'LOWEST-YIELD SHAPE' ctl.txt >/dev/null 2>&1 || true
          [ "$fail" = 0 ] && echo "shape control pattern UNCHANGED: base+burst+coprime+impatient CAUGHT, eager VOID (4 of 5, named not averaged)"
          exit $fail

  tool-selftests:
    name: the saltworks tool selftests run at all (census D, D10)
    runs-on: ubuntu-latest
    # ⛔ FOUR SHIPPED SELFTESTS HAD NEVER RUN IN CI — the D arm 2 census (2026-09-13) found 0 invoking
    #   hits for each in .github, selftest.py and nightly.sh. This file's own ledger-tools job states why
    #   that matters: a red selftest nobody runs is indistinguishable from a green one.
    # ⭐ MEASURED ON THIS RUNNER BEFORE IT GATED (saltworks #41, draft): all four pass. The lock test's one
    #   red in the first cut was E3, which refused to run without macOS sandbox-exec. E3 now also runs when
    #   the fleet log's directory is absent, as it is here, so a fallback write cannot land. The pre-#40
    #   wrapper was run here too, as a RED-FIRST control: 46/4 (E3 E4 I1 I4), the same four as on macOS.
    #   The current wrapper is 50/0.
    # Each suite is its own step, and every step runs whatever the one before it did, so a single run reports
    #   all four. The job still fails if any one fails.
    steps:
      - uses: actions/checkout@v4
      - name: scratch_twins --selftest
        run: python3 scripts/scratch_twins.py --selftest
      - name: env_probe --selftest
        if: success() || failure()
        run: sh tools/env_probe.sh --selftest
      - name: saltqueue_selftest
        if: success() || failure()
        run: bash tools/saltqueue_selftest.sh
      - name: saltbuild lock test (drives the REAL wrapper against a private lock and log)
        if: success() || failure()
        run: bash tools/saltbuild-lock-test.sh
