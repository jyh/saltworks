name = "saltworks"
version = "0.1.0"
keywords = ["hardware", "verification", "formal-methods"]
defaultTargets = ["SaltWorks"]

# MEMORY BACKSTOP for the build path (Captain-approved 19:02).
# `saltbuild.sh` caps only its `*.lean` audit branch; `lake build` passed no `-M`
# at all, which is where every one of the day's pressure events came from.
#
# WHY `weakLeanArgs` AND NOT `moreLeanArgs`, which the order named: both are
# passed to `lean` when compiling a module (Lake source, LeanConfig.lean:161-180,
# read rather than remembered). They differ in one property, and Lake's own
# docstring is explicit — `weakLeanArgs` "do not affect the trace of the build
# result, so they can be changed without triggering a rebuild."
# A memory cap cannot change a successful build's OUTPUT; it only decides whether
# the build survives. So it is semantically weak by nature, and putting it in
# `moreLeanArgs` would invalidate every trace in both repos on every adjustment —
# 9,718 jobs in salt, mid-wave, for a guard that changes no result.
#
# RE-VERIFIED 2026-08-06 ~21:20 ON THE MAESTRO'S CAP CHASE, and one result
# overturns a rule this fleet ratified. Read from Lake's OWN trace, not inferred:
#   bin/lean -M 20000 .../SaltWorks/HDL/ISA.lean     ->  Built (813ms)
#   bin/lean -M 20000 .../Salt.lean                  ->  Built (25s)
# so the key binds on both repos, observed on modules that were BUILT and not
# Replayed -- a replayed module issues no lean invocation and proves nothing.
#
# AND THE WEAK PROPERTY IS MEASURED RATHER THAN ARGUED: changing the cap with
# no artifact deleted did NOT trigger a rebuild (exit 0, nothing recompiled).
# That is the whole reason this is not `moreLeanArgs`, which would invalidate
# 9,718 traces in salt and 8,606 here on every adjustment to a guard that
# changes no result.
#
# /!\ AND THE PARAGRAPH THAT USED TO SIT HERE WAS WRONG. It told every seat to
# "judge a cap hit by exit 134 and `Stack overflow detected. Aborting.`". An
# 11-agent adversarial pass, commissioned against that very proposal, KILLED it:
#   - not sufficient: the identical bytes appear with NO -M at all, and at
#     -M 100000, on a 300k-deep paren tower peaking at 3.23 GiB;
#   - not necessary: the canonical workload does NOT produce them -- the abort
#     needs a `set_option maxRecDepth` the workload never had;
#   - wrong exit code: on the BUILD path saltbuild returns EXIT=1, never 134;
#   - wrong channel: both lines are on lake's STDOUT. Process stderr carries
#     only `error: build failed`.
# The ratified diagnostic was never missing -- the `decide` tactic's own lazy
# renderer exhausts the C stack WHILE PRINTING IT.
#
# THE RULE IS NOW M-2: docs/hdl-cap-rule-M2-0806.md. Its core is a DIFFERENTIAL
# TEST, not a text match -- `rm -rf .lake/build`, double the cap, rebuild: green
# means it was the cap, byte-identical means it was not.
#
# /!\ AND READ M-2.8 BEFORE TRUSTING A GREEN BUILD. `-M` is NOT a process
# limit; it is a budget tested where the C++ runtime calls `lean::check_memory`
# -- e.g. the interpreter and the kernel -- against Lean's OWN ALLOCATION
# COUNTER, never process RSS.
#
# NOT `checkSystem`: that wording was here from 21:58 to 22:4x and it is WRONG.
# Lean/CoreM.lean:496-499 is `checkInterrupted` + `checkMaxHeartbeats` and a
# TODO -- it does not look at memory at all. Corrected because the first seat to
# grep CoreM.lean would have disbelieved the whole note.
#
# MEASURED: `-M 1` passed a compile peaking at 1.86 GiB (~1900x its cap),
# replicated by 3 agents over 4 runs to within 0.5%; and `#eval 1+1` is green
# under `-M 1` while holding 374 MiB resident -- ~375 MB of baseline (mmapped
# oleans, the binary) is invisible to the counter.
#
# BUT DO NOT READ THAT AS "the backstop is worthless" -- MEASURED THE OTHER WAY
# TOO: every real module in this repo IS checkpointed. ISA.lean at --cap 1 dies
# with 96 occurrences of the ratified string; 19 of 19 real modules fail at
# --cap 1; and on the heaviest (FabricRoutes, 14.83 GB) the cap binds to within
# 1.1 MB. For ONE module, green at 20000 really is evidence of staying under.
#
# /!\ THE REAL EXPOSURE IS CONCURRENCY, and it is not what the note used to say:
# saltbuild.sh sets LEAN_NUM_THREADS=4 and `lake build` runs up to FOUR lean
# processes at once, EACH with its own 20 GB budget. 4 x 20 = 80 GB of licence
# on a 64 GB machine. The per-module guarantee is real; the per-MACHINE one does
# not exist.
weakLeanArgs = ["-M", "20000"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0-rc1"

[[lean_lib]]
name = "SaltWorks"
